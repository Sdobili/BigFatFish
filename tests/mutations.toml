required_ids = [
    "bus-put-nonblocking",
    "bus-full-returns-false",
    "bus-maxsize-bounded",
    "bus-maxsize-check-bound",
    "bus-maxsize-check-raise",
    "hard-sniff-off",
    "hard-ok-on-violation",
    "hard-dup-off",
    "hard-missing-off",
    "hard-utf8-off",
]

[[mutant]]
id = "bus-put-nonblocking"
file = "src/bigfatfish/core/bus.py"
original = "self._items.put_nowait(ev)"
replacement = "self._items.put(ev)"
kill = ["tests/test_core.py::test_bus_never_blocks"]
expect = "assert not True"
why = "put 会阻塞，反射层会被卡住"

[[mutant]]
id = "bus-full-returns-false"
file = "src/bigfatfish/core/bus.py"
original = "            return False"
replacement = "            return True"
kill = ["tests/test_core.py::test_bus_never_blocks"]
expect = "[True] == [False]"
why = "队列满时必须返回 False，否则丢弃被当成写入成功"

[[mutant]]
id = "bus-maxsize-bounded"
file = "src/bigfatfish/core/bus.py"
original = "queue.Queue(maxsize=maxsize)"
replacement = "queue.Queue(maxsize=0)"
kill = ["tests/test_core.py::test_bus_never_blocks"]
expect = "[True] == [False]"
why = "maxsize=0 是无限队列，满队列不再发生"

[[mutant]]
id = "bus-maxsize-check-bound"
file = "src/bigfatfish/core/bus.py"
original = "if maxsize < 1:"
replacement = "if maxsize < 0:"
kill = ["tests/test_core.py::test_channel_rejects_non_positive_maxsize"]
expect = "DID NOT RAISE"
why = "maxsize 为 0 时必须拒绝"

[[mutant]]
id = "bus-maxsize-check-raise"
file = "src/bigfatfish/core/bus.py"
original = "raise ValueError(\"maxsize must be at least 1\")"
replacement = "pass"
kill = ["tests/test_core.py::test_channel_rejects_non_positive_maxsize"]
expect = "DID NOT RAISE"
why = "非法 maxsize 必须抛出 ValueError"

[[mutant]]
id = "hard-sniff-off"
file = "scripts/check_assets.py"
original = "def _sniff(head: bytes) -> str | None:"
replacement = "def _sniff(head: bytes) -> str | None:\n    return None"
kill = ["tests/test_check_assets.py::test_check_assets_rejects_png_renamed_to_bin"]
expect = "assert 'notes/pic.bin: "
why = "关掉文件头识别后，改名的 PNG 不再被当成素材"

[[mutant]]
id = "hard-ok-on-violation"
file = "scripts/check_assets.py"
original = "_write_utf8(\"\\n\".join(violations))"
replacement = "_write_utf8(\"\\n\".join(violations) + \"\\nOK\")"
kill = ["tests/test_check_assets.py::test_check_assets_rejects_unregistered_image"]
expect = "assert 'OK' not in"
why = "有违规时也打印 OK，rejects 测试必须拒绝"

[[mutant]]
id = "hard-dup-off"
file = "scripts/check_assets.py"
original = "if asset_path in first_line:"
replacement = "if False:"
kill = ["tests/test_check_assets.py::test_check_assets_rejects_duplicate_registration"]
expect = "assert 'assets/own/x.png: ASSETS.md "
why = "重复登记被后一行覆盖后，闸门不再报重复"

[[mutant]]
id = "hard-missing-off"
file = "scripts/check_assets.py"
original = "if path not in tracked_set:"
replacement = "if False:"
kill = ["tests/test_check_assets.py::test_check_assets_rejects_registered_but_missing"]
expect = "assert 'assets/own/gone.png: "
why = "登记了但未被 git 跟踪的路径不再被当成违规"

[[mutant]]
id = "hard-utf8-off"
file = "scripts/check_assets.py"
original = "_write_utf8(\"\\n\".join(violations))"
replacement = "sys.stdout.write(\"\\n\".join(violations) + \"\\n\")"
kill = ["tests/test_check_assets.py::test_check_assets_output_survives_cp1252"]
expect = "UnicodeEncodeError:"
why = "cp1252 下改回 sys.stdout.write 会抛 UnicodeEncodeError，违规信息出不来"
